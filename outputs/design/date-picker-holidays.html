<script>
(() => {
  const root = document.getElementById('diary-picker-concepts');
  const holidayDates = {
    '2026-01-01':'새해 첫날',
    '2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴',
    '2026-03-01':'삼일절','2026-03-02':'대체공휴일(삼일절)',
    '2026-05-01':'노동절','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일(부처님오신날)',
    '2026-06-03':'전국동시지방선거','2026-06-06':'현충일','2026-07-17':'제헌절',
    '2026-08-15':'광복절','2026-08-17':'대체공휴일(광복절)',
    '2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴',
    '2026-10-03':'개천절','2026-10-05':'대체공휴일(개천절)','2026-10-09':'한글날','2026-12-25':'성탄절'
  };
  const modes = {date:'날짜',month:'월',year:'연도'};
  const weekdays = ['일','월','화','수','목','금','토'];
  const saved = window.openai?.widgetState?.privateContent?.pickers || window.openai?.widgetState?.pickers || {};
  const allStates = {};
  const renders = {};
  const key = (year,month,day) => `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const count = (year,month) => year === 2026 ? Object.keys(holidayDates).filter(date => date.startsWith(`${year}-${String(month).padStart(2,'0')}-`)).length : null;
  const save = () => {
    if (window.openai?.setWidgetState) {
      const pickers = Object.fromEntries(Object.entries(allStates).map(([name,value]) => [name,{mode:value.mode,year:value.year,month:value.month,day:value.day,applied:value.applied,yearStart:value.yearStart}]));
      window.openai.setWidgetState({modelContent:{type:'날짜 선택기 디자인 검토',selections:Object.fromEntries(Object.entries(pickers).map(([name,value])=>[name,value.applied]))},privateContent:{pickers}}).catch(()=>{});
    }
  };
  function mount(picker) {
    const design = picker.dataset.design;
    const isApp = design === 'app';
    const trigger = isApp ? root.querySelector('.dp-app-trigger') : null;
    const initial = saved[design] || {};
    const state = {mode:['date','month','year'].includes(initial.mode)?initial.mode:'date',year:Number(initial.year)||2026,month:Number(initial.month)||10,day:Number(initial.day)||9,applied:initial.applied||'2026-10-09',yearStart:Number(initial.yearStart)||2020,status:'',radius:isApp?16:26,accent:'#b76e79'};
    allStates[design] = state;
    const list = design === 'holidays';
    function setDate(year,month,day) {
      state.year=year;state.month=month;state.day=Math.min(day,new Date(year,month,0).getDate());
    }
    function title() {
      if(state.mode==='year') return `${state.year}년`;
      if(state.mode==='month') return `${state.year}년 ${state.month}월`;
      const weekday=weekdays[new Date(state.year,state.month-1,state.day).getDay()];
      return `${state.month}월 ${state.day}일 ${weekday}요일`;
    }
    function period() {
      const yearMode=state.mode==='year';
      const center=yearMode?`${state.yearStart}–${state.yearStart+11}년`:`<button class="dp-quiet cursor-interaction" data-action="year-mode">${state.year}년</button>${state.mode==='date'?`<button class="dp-quiet cursor-interaction" data-action="month-mode">${state.month}월⌄</button>`:''}`;
      return `<div class="dp-period"><button class="dp-arrow cursor-interaction" data-action="previous" aria-label="이전 ${yearMode?'연도 구간':state.mode==='month'?'연도':'월'}">‹</button><div class="dp-period-value">${center}</div><button class="dp-arrow cursor-interaction" data-action="next" aria-label="다음 ${yearMode?'연도 구간':state.mode==='month'?'연도':'월'}">›</button></div>`;
    }
    function calendar() {
      const start=new Date(state.year,state.month-1,1).getDay();
      const last=new Date(state.year,state.month,0).getDate();
      let cells=Array.from({length:start},()=>'<span aria-hidden="true"></span>').join('');
      for(let day=1;day<=last;day++) {
        const date=key(state.year,state.month,day);const holiday=holidayDates[date];
        cells+=`<button class="dp-day cursor-interaction ${holiday?'dp-is-holiday':''}" aria-pressed="${day===state.day}" data-day="${day}" aria-label="${state.year}년 ${state.month}월 ${day}일${holiday?`, ${holiday}`:''}"><span class="dp-day-number">${day}</span></button>`;
      }
      const holidays=Object.entries(holidayDates).filter(([date])=>date.startsWith(`${state.year}-${String(state.month).padStart(2,'0')}-`));
      let detail='';
      if(state.year!==2026) detail=`<section class="dp-holiday-section" aria-label="${state.year}년 ${state.month}월 공휴일 목록"><h3>${state.year}년 ${state.month}월 공휴일</h3><p class="dp-data-note">이 시안의 공휴일 예시는 2026년만 제공해요.</p></section>`;
      else detail=`<section class="dp-holiday-section" aria-label="${state.year}년 ${state.month}월 공휴일 목록"><h3>${state.year}년 ${state.month}월 공휴일 · ${holidays.length}일</h3>${holidays.length?holidays.map(([date,name])=>`<button class="dp-holiday-line cursor-interaction" data-day="${Number(date.slice(8))}" aria-pressed="${Number(date.slice(8))===state.day}"><strong>${list?`${state.month}월 ${Number(date.slice(8))}일`:`${state.month}.${Number(date.slice(8))}`}</strong><span>${name}</span></button>`).join(''):'<p class="dp-data-note">이달은 공휴일이 없어요.</p>'}</section>`;
      return `<div class="dp-calendar-layout"><section class="dp-calendar-section" aria-label="${state.year}년 ${state.month}월 달력">${isApp?'':`<h3>${state.year}년 ${state.month}월 달력</h3>`}<div class="dp-weekdays">${weekdays.map((day,index)=>`<span class="${index===6?'dp-saturday':index===0?'dp-sunday':''}">${day}</span>`).join('')}</div><div class="dp-days">${cells}</div></section>${isApp?'':detail}</div>`;
    }
    function months() {
      return `<div class="${list?'dp-month-list':'dp-months'}">${Array.from({length:12},(_,index)=>{
        const month=index+1;const total=count(state.year,month);
        return `<button class="${list?'dp-month-row':'dp-tile'} cursor-interaction" data-month="${month}" aria-pressed="${month===state.month}" aria-label="${state.year}년 ${month}월${isApp?'':`, 공휴일 ${total===null?'미확인':`${total}일`}`}"><span>${month}월</span>${isApp?'':`<span class="dp-count">${total===null?'정보 확인 중':`공휴일 ${total}일`}</span>`}</button>`;
      }).join('')}</div>`;
    }
    function years() {
      return `<div class="${list?'dp-year-list':'dp-years'}">${Array.from({length:12},(_,index)=>{
        const year=state.yearStart+index;
        return `<button class="dp-tile dp-year cursor-interaction" data-year="${year}" aria-pressed="${year===state.year}">${year}년</button>`;
      }).join('')}</div>`;
    }
    function render() {
      picker.style.borderRadius=state.radius+'px';picker.style.setProperty('--dp-accent',state.accent);
      if(isApp) {
        const restoreFocus=picker.contains(document.activeElement);
        const [year,month,day]=state.applied.split('-').map(Number);
        trigger.textContent=`${year}년 ${month}월 ${day}일 ⌄`;
        picker.setAttribute('aria-label',`${modes[state.mode]} 선택`);
        picker.innerHTML=`${period()}${state.mode==='date'?calendar():state.mode==='month'?months():years()}`;
        if(restoreFocus&&!picker.hidden)picker.querySelector('[aria-pressed="true"]')?.focus();
        return;
      }
      picker.innerHTML=`<div class="dp-grabber" aria-hidden="true"></div><div class="dp-top"><h2>${modes[state.mode]} 고르기</h2><button class="dp-quiet cursor-interaction" data-action="cancel">취소</button></div><div class="dp-modes" role="group" aria-label="선택 단위">${Object.entries(modes).map(([value,label])=>`<button class="dp-mode cursor-interaction" data-mode="${value}" aria-pressed="${state.mode===value}">${label}</button>`).join('')}</div><div class="dp-summary"><p class="dp-eyebrow">${state.mode==='date'?'선택할 날짜':state.mode==='month'?'이동할 월':'이동할 연도'}</p><div class="dp-selected" aria-live="polite">${title()}</div></div>${period()}${state.mode==='date'?calendar():state.mode==='month'?months():years()}<div class="dp-footer"><button class="dp-apply cursor-interaction" data-action="apply">${state.mode==='date'?'이 날짜 선택':state.mode==='month'?`${state.month}월로 이동`:'이 연도 선택'}</button><div class="dp-result" role="status">${state.status}</div></div>`;
    }
    picker.addEventListener('click',event=>{
      if(isApp)event.stopPropagation();
      const button=event.target.closest('button');if(!button||!picker.contains(button))return;
      if(button.dataset.mode){state.mode=button.dataset.mode;state.status='';}
      else if(button.dataset.day){state.day=Number(button.dataset.day);state.status='';if(isApp){state.applied=key(state.year,state.month,state.day);setOpen(false,false,true);}}
      else if(button.dataset.month){setDate(state.year,Number(button.dataset.month),state.day);state.status='';if(isApp)state.mode='date';}
      else if(button.dataset.year){setDate(Number(button.dataset.year),state.month,state.day);state.mode='month';state.status='';}
      else {
        const action=button.dataset.action;
        if(action==='year-mode'){state.mode='year';state.yearStart=Math.floor(state.year/12)*12;state.status='';}
        if(action==='month-mode'){state.mode='month';state.status='';}
        if(action==='previous'||action==='next') {
          const step=action==='next'?1:-1;
          if(state.mode==='year')state.yearStart+=step*12;
          else if(state.mode==='month')setDate(state.year+step,state.month,state.day);
          else {const date=new Date(state.year,state.month-1+step,1);setDate(date.getFullYear(),date.getMonth()+1,state.day);}
          state.status='';
        }
        if(action==='cancel'){const [year,month,day]=state.applied.split('-').map(Number);setDate(year,month,day);state.status='변경을 취소했어요.';}
        if(action==='apply') {
          state.applied=key(state.year,state.month,state.day);
          state.status=state.mode==='date'?`${state.month}월 ${state.day}일을 선택했어요.`:state.mode==='month'?`${state.month}월로 이동했어요.`:`${state.year}년을 선택했어요.`;
          if(state.mode==='year')state.mode='month';
        }
      }
      render();save();
    });
    renders[design]=render;
    render();
    function setOpen(open,discard=false,restoreFocus=false) {
      if(discard){const [year,month,day]=state.applied.split('-').map(Number);setDate(year,month,day);state.mode='date';render();save();}
      picker.hidden=!open;trigger?.setAttribute('aria-expanded',String(open));
      if(open)picker.querySelector('[aria-pressed="true"]')?.focus();
      else if(restoreFocus)trigger?.focus();
    }
    if(isApp) {
      trigger.addEventListener('click',event=>{event.stopPropagation();const opening=picker.hidden;setOpen(opening,opening);});
      root.addEventListener('click',event=>{if(!picker.hidden&&!picker.contains(event.target)&&!trigger.contains(event.target))setOpen(false,true);});
      root.addEventListener('keydown',event=>{if(event.key==='Escape'&&!picker.hidden){event.preventDefault();event.stopPropagation();setOpen(false,true,true);}});
    }
    if(globalThis.Tweak) {
      const tweak=new Tweak({container:picker,onChange:render});
      tweak.addSlider(state,'radius',{label:'선택창 모서리',min:14,max:32,step:2,unit:'px'});
      tweak.addColorPicker(state,'accent',{label:'앱 테마색',reference:'--dp-accent'});
    }
  }
  root.querySelectorAll('.dp-picker').forEach(mount);
  window.addEventListener('openai:set_globals',event=>{
    const restored=event.detail?.globals?.widgetState?.privateContent?.pickers||event.detail?.globals?.widgetState?.pickers;
    if(!restored)return;
    root.querySelectorAll('.dp-picker').forEach(picker=>{
      const state=allStates[picker.dataset.design],value=restored[picker.dataset.design];
      if(value&&state){for(const field of ['mode','year','month','day','applied','yearStart'])if(value[field]!==undefined)state[field]=value[field];renders[picker.dataset.design]();}
    });
  });
})();
</script>
